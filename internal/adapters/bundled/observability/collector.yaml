extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlphttp/tempo:
    endpoint: http://agenova-tempo:4318
    timeout: 2s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 10s
  otlphttp/loki:
    endpoint: http://agenova-loki:3100/otlp
    timeout: 2s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 10s
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
