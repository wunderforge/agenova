# EKS operator policy. Keep startup, offline and replacement workers denied.
# Only a UID/claim-guarded control-plane stamp delegates to per-Work rules;
# the stamp itself grants no traffic. Namespace/template default deny MUST remain,
# and legacy additive internet allows MUST be drained before applying this policy.
# Apply only after the VPC CNI CRD exists. This is not a control-plane RBAC grant.
apiVersion: networking.k8s.aws/v1alpha1
kind: ClusterNetworkPolicy
metadata:
  name: agenova-demo-worker-egress-deny
spec:
  tier: Admin
  priority: 10
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agenova-system
      podSelector:
        matchExpressions:
          - key: agents.x-k8s.io/sandbox-name-hash
            operator: Exists
          - key: agenova.io/network-incarnation
            operator: DoesNotExist
  egress:
    - name: no-direct-network-egress
      action: Deny
      to:
        - networks: ["0.0.0.0/0"]
