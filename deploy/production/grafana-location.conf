# Optional fragment INSIDE the existing HTTPS proxy server block.
# Install only after the private backend, bridge and NetworkPolicies are ready.
location = /grafana {
  if ($host != app.agenova.app) { return 421; }
  if ($tls_transport = 0) { return 403; }
  return 303 /grafana/;
}
location /grafana/ {
  if ($host != app.agenova.app) { return 421; }
  if ($tls_transport = 0) { return 403; }
  proxy_pass http://agenova-grafana-proxy.agenova-observability.svc.cluster.local:8080;
  proxy_set_header Host app.agenova.app;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-User "";
  proxy_set_header X-Forwarded-Email "";
  proxy_set_header X-WEBAUTH-USER "";
  proxy_set_header X-WEBAUTH-ROLE "";
  proxy_read_timeout 60s;
}
