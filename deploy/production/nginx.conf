worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_x_forwarded_proto $tls_transport { default 0; https 1; }
  server {
    listen 8089;
    server_tokens off;
    client_max_body_size 128k;
    location = /healthz { proxy_pass http://127.0.0.1:8080/readyz; }
    location / {
      if ($host != app.agenova.app) { return 421; }
      if ($tls_transport = 0) { return 403; }
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host app.agenova.app;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-User "";
      proxy_set_header X-Forwarded-Email "";
      proxy_read_timeout 180s;
    }
  }
}
