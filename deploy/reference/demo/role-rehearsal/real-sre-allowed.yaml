apiVersion: agenova.io/v1alpha1
kind: ClaimRequest
metadata:
  name: incident-sre-rollback-allowed-r2
spec:
  templateRef: engineer
  projectRef: payments
  task:
    type: investigation
    input:
      completionTool: kubernetes.rollback
      completionMode: success
      objective: "You are the on-call Payments SRE for a synthetic incident. Read README.md and logs/timeout.log for the regression and rollback safety facts. The v2.7 error rate is high, no schema migration occurred, and v2.6 is the ready prior revision. Your deliverable is service restoration, not a suggestion: invoke kubernetes.rollback with a brief reason and safety checks after reading the evidence, then report the actual resulting version only if the tool confirms success. Do not create a PR or invent a completed rollback."
  requestedAccess:
    tools: [git.read, github.pr.create, kubernetes.rollback]
    resourceScopes: [repo:wunderforge/agenova-payment-incident-demo, k8s:kind-agenova-k8s-lab/agenova-payment-demo/payment-api]
    modelProfile: coding-standard
  runtime:
    profileRef: standard-isolated
    timeout: 8m
