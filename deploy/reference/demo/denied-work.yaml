apiVersion: agenova.io/v1alpha1
kind: ClaimRequest
metadata:
  name: investigate-unapproved-project
spec:
  templateRef: engineer
  projectRef: billing
  task:
    type: investigation
    input:
      objective: Investigate a synthetic billing retry alert.
  requestedAccess:
    tools: [git.read]
    resourceScopes: [repo:acme/payments]
    modelProfile: coding-standard
  runtime:
    profileRef: standard-isolated
    timeout: 1m
