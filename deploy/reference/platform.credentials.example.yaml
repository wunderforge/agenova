# Operator example: select a real provider endpoint and provision the named
# Opaque Secret in the explicit namespace before apply. No values belong here.
apiVersion: agenova.io/v1alpha1
kind: Platform
metadata:
  name: credentialed-reference-example
spec:
  adapters:
    - name: kubernetes-deployment
      id: agenova.io/deployment/kubernetes
      version: 0.1.0
    - name: agent-sandbox-runtime
      id: agenova.io/runtime/agent-sandbox
      version: 0.1.0
    - name: openai-compatible-backend
      id: agenova.io/model/openai-compatible
      version: 0.1.0
    - name: kubernetes-secret-resolver
      id: agenova.io/credential/kubernetes-secret
      version: 0.1.0
  infrastructure:
    deployment:
      name: control-plane
      adapterRef: kubernetes-deployment
      config:
        context: kind-agenova-k8s-lab
        namespace: agenova-credentials-example
    runtimeBackends:
      - name: primary-runtime
        adapterRef: agent-sandbox-runtime
        config:
          connection:
            mode: in-cluster
            namespace: agenova-credentials-example
          compatible-worker-image: agenova-testworker:kind
    runtimeProfiles:
      - name: standard-isolated
        backendRef: primary-runtime
        config:
          isolation: dedicated
  services:
    credentialResolvers:
      - name: model-secrets
        adapterRef: kubernetes-secret-resolver
        config:
          namespace: agenova-credentials-example
    modelBackends:
      - name: local-ollama
        adapterRef: openai-compatible-backend
        credentialRef:
          resolverRef: model-secrets
          name: model-provider-token
          key: token
        config:
          endpoint: https://provider.example.invalid/v1
    modelProfiles:
      - name: coding-standard
        backendRef: local-ollama
        config:
          model: llama3.1:latest
  initialPolicyRef:
    id: reference-default-deny
    version: "1"
