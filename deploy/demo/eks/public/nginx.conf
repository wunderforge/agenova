worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_origin $checked_origin { default $http_origin; "" "https://$host"; "https://demo.agenova.app" "https://$host"; }
  map "$uri:$http_x_forwarded_proto" $transport_ok { default 0; ~^/healthz: 1; ~:https$ 1; }
  # External links may navigate to the Portal document; API fetches and writes
  # remain blocked. Authentication still applies to the document.
  map "$request_method:$http_sec_fetch_mode:$http_sec_fetch_dest:$uri" $portal_navigation {
    default 0;
    "GET:navigate:document:/" 1;
    "GET:navigate:document:/index.html" 1;
    "GET:navigate:document:/login" 1;
  }
  map "$http_sec_fetch_site:$portal_navigation" $blocked_cross_site {
    default 0;
    "cross-site:0" 1;
  }
  map "$uri:$http_origin" $form_opaque_origin {
    default 0;
    "/login:null" 1;
    "/logout:null" 1;
  }
  map "$checked_origin:$form_opaque_origin" $origin_to_check {
    default $checked_origin;
    "null:1" "https://$host";
  }
  server {
    listen 0.0.0.0:8089;
    server_tokens off;
    absolute_redirect off;
    root /site;
    auth_request /_session_check;
    client_max_body_size 128k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    if ($transport_ok = 0) { return 403; }
    if ($origin_to_check != "https://$host") { return 403; }
    if ($blocked_cross_site = 1) { return 403; }
    location = /healthz { auth_request off; return 200 "ok\n"; }
    location = /_session_check {
      internal;
      auth_request off;
      proxy_pass http://127.0.0.1:8090/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location = /login {
      auth_request off;
      proxy_pass http://127.0.0.1:8090/login;
    }
    location = /logout {
      auth_request off;
      proxy_pass http://127.0.0.1:8090/logout;
    }
    location /api/ {
      proxy_pass http://127.0.0.1:8088;
      proxy_set_header Host $host;
      # The external origin was checked above; the internal hop is HTTP.
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_read_timeout 240s;
      proxy_hide_header Access-Control-Allow-Origin;
    }
    location @signin { return 303 /login; }
    location / {
      error_page 401 = @signin;
      sub_filter_once on;
      sub_filter '</body>' '<a href="/logout" aria-label="Sign out of team demo" style="position:fixed;right:20px;bottom:20px;z-index:1000;padding:10px 16px;border:1px solid #64748b;border-radius:8px;background:#152039;color:#fff;font:14px system-ui;text-decoration:none">Sign out</a></body>';
      try_files $uri $uri/ /index.html;
    }
  }
}
