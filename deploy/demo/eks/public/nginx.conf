worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_origin $checked_origin { default $http_origin; "" "https://$host"; "https://demo.agenova.app" "https://$host"; }
  map "$uri:$http_x_forwarded_proto" $transport_ok { default 0; ~^/healthz: 1; ~:https$ 1; }
  server {
    listen 0.0.0.0:8089;
    server_tokens off;
    root /site;
    auth_basic "Agenova team demo";
    auth_basic_user_file /auth/htpasswd;
    client_max_body_size 128k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    if ($transport_ok = 0) { return 403; }
    if ($checked_origin != "https://$host") { return 403; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    location = /healthz { auth_basic off; return 200 "ok\n"; }
    location /api/ {
      proxy_pass http://127.0.0.1:8088;
      proxy_set_header Host $host;
      # The external origin was checked above; the internal hop is HTTP.
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_read_timeout 240s;
      proxy_hide_header Access-Control-Allow-Origin;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
