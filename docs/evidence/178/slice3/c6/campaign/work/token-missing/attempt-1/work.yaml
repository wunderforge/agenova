apiVersion: agenova.io/v1alpha1
kind: ClaimRequest
metadata:
  name: e16-token-missing-a1
spec:
  templateRef: e16-engineer
  projectRef: payments
  task:
    type: investigation
    input:
      objective: Read README.md from the repository and summarise in two sentences what the incident it describes is about.
  requestedAccess:
    tools: [repo.read]
    resourceScopes: [repo:agenova/e16-token-missing]
    modelProfile: coding-standard
  runtime:
    profileRef: standard-isolated
    timeout: 5m
