apiVersion: agenova.io/v1alpha1
kind: AgentTemplate
metadata:
  name: engineer
spec:
  artifact:
    image: ghcr.io/wunderforge/agenova-engineer:v0
  entrypoint:
    command: [/agenova-agent, run]
  capabilityCeiling:
    tools: [git.read]
  environment:
    GITHUB_TOKEN: DO_NOT_USE_FIXTURE_SECRET_VALUE
