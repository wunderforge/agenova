# One upstream-native SandboxClaim adopting a sandbox from smoke-pool.
# Agent Sandbox v0.4.6 / extensions.agents.x-k8s.io/v1alpha1: the claim points
# at the template and names its warm pool via `warmpool` (a string field in
# v1alpha1). The script deletes the claim, pool and template before asserting
# pods reach zero, so warm-pool replenishment cannot keep the smoke pods alive.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxClaim
metadata:
  name: smoke-claim
  namespace: agent-sandbox-smoke
spec:
  sandboxTemplateRef:
    name: smoke-template
  warmpool: smoke-pool
