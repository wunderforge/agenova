# Pre-warms exactly one sandbox from smoke-template so the claim below can be
# satisfied without a cold start. Single-pool path only (E8-T3 scope).
# Agent Sandbox v0.4.6 / extensions.agents.x-k8s.io/v1alpha1.
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxWarmPool
metadata:
  name: smoke-pool
  namespace: agent-sandbox-smoke
spec:
  replicas: 1
  sandboxTemplateRef:
    name: smoke-template
