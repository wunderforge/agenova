apiVersion: harness.agenova.io/v1alpha1
kind: SmokeScenario
metadata:
  name: smoke-claim-lifecycle
  phase: phase-2
spec:
  description: >
    Minimal claim lifecycle through the SpikeAdapter against a real kind cluster.
    Verifies: create (Pending), controller bind (Bound), controller start (Running),
    adapter-triggered succeed (Succeeded). Uses busybox:stable as a real, pullable
    container image.

  # ClaimLifecycleE2ECheck exercises the full lifecycle path from AddClaim through
  # SucceedClaim using the SpikeAdapter.
  check: ClaimLifecycleE2ECheck

  resources:
    - kind: SandboxTemplate
      name: agenova-tmpl-busybox-v1
      image: busybox:stable
      command: ["sh", "-c", "sleep 10"]

    - kind: SandboxWarmPool
      name: agenova-pool-busybox-pool
      templateRef: agenova-tmpl-busybox-v1
      replicas: 1

    - kind: SandboxClaim
      name: agenova-claim-smoke-run
      poolRef: agenova-pool-busybox-pool

  expectedOutcome:
    claimPhase: Succeeded
    sandboxReplaced: true
    poolIdleAfter: 1

  knownGaps:
    - id: async-bind-start
      description: >
        BindClaim and StartClaim are controller-driven async waits, not explicit
        API triggers. The adapter polls for state transitions within a timeout.
    - id: no-upstream-succeeded-phase
      description: >
        Upstream SandboxClaim has no Succeeded/Failed phase. The adapter deletes
        the upstream resource on terminal transitions and records state locally.
    - id: pool-status-approximated
      description: >
        Upstream SandboxWarmPool status does not break down IdleSandboxes,
        BoundClaims, RunningClaims per the Agenova contract. These are
        approximated from local adapter claim state.
