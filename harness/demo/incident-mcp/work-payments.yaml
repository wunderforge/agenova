apiVersion: agenova.io/v1alpha1
kind: ClaimRequest
metadata:
  name: investigate-payment-timeout
spec:
  templateRef: incident-investigator-demo-v1
  projectRef: payments
  task:
    type: investigation
    input:
      objective: >-
        Investigate payment timeout incident INC-P1042. Read both available
        files payments/INC-P1042/logs.txt and payments/INC-P1042/retry.txt.
        Explain the evidence, likely cause and a concise proposed fix. Cite file
        names. This is read-only investigation; do not change or deploy anything.
  requestedAccess:
    tools: [repo.read]
    resourceScopes: [repo:demo/payments]
    modelProfile: coding-standard
  runtime:
    profileRef: standard-isolated
    timeout: 3m
