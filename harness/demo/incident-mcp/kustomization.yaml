apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenova-e16
labels:
  - pairs: {app.kubernetes.io/part-of: agenova-incident-demo}
    includeSelectors: false
resources: [deploy.yaml]
configMapGenerator:
  - name: incident-evidence-data
    files:
      - payment-logs=data/payments/INC-P1042/logs.txt
      - payment-retry=data/payments/INC-P1042/retry.txt
      - billing-logs=data/billing/INC-B2081/logs.txt
      - billing-job=data/billing/INC-B2081/job-config.txt
      - legacy-readme=data/README.md
      - legacy-timeout=data/logs/timeout.log
      - legacy-retry=data/src/retry.txt
