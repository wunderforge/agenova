apiVersion: v1
kind: Namespace
metadata:
  name: agenova-e16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e16-mcp
spec:
  # Exactly one replica: one pod log is the complete call record.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e16-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e16-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Built and loaded into kind locally; record its digest as evidence.
          image: agenova-e16-mcp:0.1.0
          imagePullPolicy: Never
          ports:
            - name: mcp
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FIXTURE_DATA_DIR
              value: /data
            # Longer than the 30s maximum backend timeout.
            - name: FIXTURE_SLOW_FILE
              value: logs/slow.log
            - name: FIXTURE_SLOW_DELAY
              value: 35s
            # Serves /mcp-token. Read once at startup; only its SHA-256 is kept.
            - name: FIXTURE_TOKEN_FILE
              value: /var/run/e16-token/token
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: token
              mountPath: /var/run/e16-token
              readOnly: true
      volumes:
        - name: data
          configMap:
            name: e16-mcp-data
            items:
              - key: readme.md
                path: README.md
              - key: timeout.log
                path: logs/timeout.log
              - key: slow.log
                path: logs/slow.log
              - key: full-trace.log
                path: logs/full-trace.log
              - key: retry.txt
                path: src/retry.txt
              - key: incident-timeline.md
                path: notes/incident-timeline.md
        # The campaign runner creates Secret e16-mcp-token (from stdin, with
        # kubectl create) before it applies this manifest. Neither the Secret
        # nor its value is part of this directory, because the rendered
        # manifest is archived as evidence. The Pod does not start without it.
        # The default file mode lets the image's UID 65532 read the token.
        - name: token
          secret:
            secretName: e16-mcp-token
            optional: false
            items:
              - key: token
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: e16-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: e16-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
