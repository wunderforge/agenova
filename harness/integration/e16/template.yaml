apiVersion: agenova.io/v1alpha1
kind: AgentTemplate
metadata:
  name: e16-engineer
spec:
  artifact:
    image: agenova-testworker:kind
  entrypoint:
    command: [/agenova-workerctl, serve]
  capabilityCeiling:
    tools: [repo.read]
    resourceScopes: [repo:agenova/e16-fixture, repo:agenova/e16-faults]
    modelProfiles: [coding-standard]
    runtimeProfiles: [standard-isolated]
    maxTimeout: 5m
