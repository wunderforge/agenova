apiVersion: agenova.io/v1alpha1
kind: ClaimRequest
metadata:
  name: e14-team-work
spec:
  templateRef: engineer
  projectRef: payments
  task:
    type: investigation
    input:
      objective: Read README.md with git.read, then finish with one concise sentence about the payment retry deadline.
  requestedAccess:
    tools: [git.read]
    resourceScopes: [repo:acme/payments]
    modelProfile: coding-standard
  runtime:
    profileRef: standard-isolated
    timeout: 5m
