apiVersion: agenova.io/v1alpha1
kind: PolicyBundle
metadata:
  name: e14-team-policy
  version: "1"
spec:
  rules:
    - subject: user-a
      team: team-a
      action: claim.create
      project: payments
      templateRef: engineer
    - subject: user-b
      team: team-b
      action: claim.create
      project: payments
      templateRef: engineer
      constraints:
        maxTimeout: 2m
