name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENOVA_CHECK_PROFILE: ${{ github.event_name == 'pull_request' && 'PR' || 'Main' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Validate PR delivery contract
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          AGENOVA_PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-pr-body.ps1 -Body $env:AGENOVA_PR_BODY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies and test browser
        run: |
          npm --prefix ui ci
          cd ui
          npx playwright install --with-deps chromium

      - name: Run shared repository quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -Profile $env:AGENOVA_CHECK_PROFILE

      - name: Upload frontend rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-evidence
          path: .tmp/ui-smoke
          include-hidden-files: true
          if-no-files-found: ignore

  cli-platforms:
    name: CLI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux credential service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring
      - name: Native Linux credentials and login tests
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c 'printf "%s" "disposable-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets; AGENOVA_TEST_OS_STORE=1 go test -v ./internal/login'
      - name: Native Windows credentials and login tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AGENOVA_TEST_OS_STORE = '1'
          go test -v ./internal/login
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and package native CLI
        shell: pwsh
        run: ./scripts/package-cli.ps1 -Version 0.1.0-preview.20261013.1
      - name: Install Windows package into clean user directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-windows.ps1 -ArchivePath .tmp/cli-release/agenova_0.1.0-preview.20261013.1_windows_amd64.zip -InstallDirectory "$env:RUNNER_TEMP/agenova-installed"
          agenova --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          agenova --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Linux Homebrew formula
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          GIT_AUTHOR_NAME="Agenova CI" GIT_AUTHOR_EMAIL="ci@example.invalid" GIT_COMMITTER_NAME="Agenova CI" GIT_COMMITTER_EMAIL="ci@example.invalid" brew tap-new agenova/ci
          cp Formula/agenova.rb "$(brew --repository agenova/ci)/Formula/agenova.rb"
          brew install agenova/ci/agenova
          brew test agenova/ci/agenova
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ runner.os }}
          path: |
            .tmp/cli-release/*.zip
            .tmp/cli-release/*.tar.gz
            .tmp/cli-release/*.sha256
          include-hidden-files: true
          if-no-files-found: error
