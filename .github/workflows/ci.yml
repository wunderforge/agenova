name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENOVA_CHECK_PROFILE: ${{ github.event_name == 'pull_request' && 'PR' || 'Main' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Validate PR delivery contract
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          AGENOVA_PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-pr-body.ps1 -Body $env:AGENOVA_PR_BODY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies and test browser
        run: |
          npm --prefix ui ci
          cd ui
          npx playwright install --with-deps chromium

      - name: Run shared repository quality gate
        shell: pwsh
        run: ./scripts/check.ps1 -Profile $env:AGENOVA_CHECK_PROFILE

      - name: Upload frontend rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-evidence
          path: .tmp/ui-smoke
          include-hidden-files: true
          if-no-files-found: ignore
