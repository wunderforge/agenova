name: Shared EKS release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish candidates to ECR (also requires SHARED_EKS_RELEASE_ENABLED)
        type: boolean
        default: false
      deploy:
        description: Deploy the candidate (also requires publish and SHARED_EKS_DEPLOY_ENABLED)
        type: boolean
        default: false

permissions:
  contents: read

# Do not interrupt a running rollout. GitHub may replace a pending run; the
# next candidate diffs from the deployed SHA, never from the previous push.
concurrency:
  group: shared-eks-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  AWS_ACCOUNT_ID: '931228356546'
  EKS_CLUSTER_NAME: agenova-demo
  K8S_NAMESPACE: agenova-system
  CONTROL_PLANE_DEPLOYMENT: agenova-member-control-plane
  CONTROL_PLANE_CONTAINER: control-plane
  ECR_CONTROL_PLANE_REPOSITORY: ${{ vars.ECR_CONTROL_PLANE_REPOSITORY }}
  ECR_WORKER_REPOSITORY: ${{ vars.ECR_WORKER_REPOSITORY }}
  SHARED_EKS_RELEASE_ENABLED: ${{ vars.SHARED_EKS_RELEASE_ENABLED }}
  SHARED_EKS_DEPLOY_ENABLED: ${{ vars.SHARED_EKS_DEPLOY_ENABLED }}
  SHARED_EKS_BASE_SHA: ${{ vars.SHARED_EKS_BASE_SHA }}
  AWS_PAGER: ''

jobs:
  validate:
    name: Validate without cloud credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Offline release behavior and workflow syntax
        run: |
          node --test scripts/release/release.test.mjs
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/shared-eks-release.yml .github/workflows/ci.yml
      - name: Install frontend checks
        run: |
          npm --prefix ui ci
          cd ui
          npx playwright install --with-deps chromium
      - name: Full source gate before any cloud access
        shell: pwsh
        run: ./scripts/check.ps1 -Profile Main

  snapshot:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.SHARED_EKS_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.publish)
    environment: shared-eks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '931228356546'
          role-session-name: snapshot-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Read existing target and source baseline (no cluster writes)
        env:
          KUBECONFIG: ${{ runner.temp }}/agenova-snapshot.kubeconfig
        run: node scripts/release/release.mjs snapshot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-snapshot
          path: snapshot.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately NO environment: publisher OIDC trust is main-ref scoped.
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-snapshot
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '931228356546'
          role-session-name: publish-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Select components, reuse immutable tags or build and publish
        run: node scripts/release/release.mjs publish
      - id: result
        name: Expose candidate summary
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${r.changed.controlPlane || r.changed.worker}\n`); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Release candidate\n```json\n"+JSON.stringify(r,null,2)+"\n```\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate
          path: |
            plan.json
            release.json
            snapshot.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: publish
    if: >-
      needs.publish.outputs.changed == 'true' &&
      vars.SHARED_EKS_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy)
    environment: shared-eks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
      - name: Stop before cluster access if Worker migration is required
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("release.json")); if(r.workerRolloutRequired){fs.writeFileSync("deployment.json",JSON.stringify({result:"blocked-worker-migration",source:r.target})); console.error("Worker candidate published; reviewed template rollout is required. No control-plane deployment."); process.exit(1);}'
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '931228356546'
          role-session-name: deploy-${{ github.run_id }}
          role-duration-seconds: 900
      - name: Guarded image-only rollout and readiness verification
        env:
          KUBECONFIG: ${{ runner.temp }}/agenova-release.kubeconfig
        run: node scripts/release/release.mjs deploy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-result
          path: deployment.json
          if-no-files-found: warn
          retention-days: 14
