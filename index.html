<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenova Interactive Console</title>
<style>
:root{--bg:#030816;--side:#081327;--panel:#0c1930;--panel2:#101f39;--line:#294361;--text:#eef6ff;--muted:#91a4c0;--cyan:#67e8f9;--blue:#60a5fa;--green:#86efac;--red:#fda4af}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,select,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:24px 15px;border-right:1px solid #223854;background:var(--side);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;padding:0 10px 28px}.logo{width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--cyan);border-radius:10px;color:var(--cyan)}nav{display:grid;gap:6px}.nav{width:100%;padding:13px 14px;border:0;border-radius:9px;background:transparent;color:#b7c6db;text-align:left;font-weight:700}.nav:hover{background:#101f39}.nav.active{background:#163158;color:#fff;box-shadow:inset 3px 0 var(--cyan)}.side-foot{margin-top:auto;padding:14px 10px;color:var(--muted);font-size:12px;border-top:1px solid #243753}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:7px;box-shadow:0 0 12px #4ade80}.main{min-width:0}.topbar{height:72px;padding:0 28px;border-bottom:1px solid #223854;background:#091326;display:flex;align-items:center;justify-content:space-between}.crumb{color:var(--muted);font-size:14px}.actions{display:flex;align-items:center;gap:9px}.btn{padding:9px 14px;border:1px solid #355174;border-radius:8px;background:#101e36;color:var(--text);font-weight:700}.btn:hover{border-color:var(--cyan);background:#17335a}.btn.primary{border-color:#38bdf8;background:#1f5b8e}.status{padding:7px 10px;border:1px solid #355174;border-radius:8px;color:#b9c8dc;font-size:12px}.content{padding:30px;max-width:1400px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}h1{margin:0;font-size:38px;line-height:1.1}h2{margin:0;font-size:22px}h3{margin:0;font-size:17px}.sub{color:var(--muted);margin:8px 0 0}.eyebrow{color:var(--cyan);font:700 11px ui-monospace,monospace;letter-spacing:1.3px;text-transform:uppercase}.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:19px}.card.clickable{transition:.18s}.card.clickable:hover{transform:translateY(-2px);border-color:#4b719d;box-shadow:0 16px 45px #0006}.good{border-color:#2f8c5e}.bad{border-color:#a5485b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.pill{display:inline-flex;padding:5px 9px;border:1px solid #3a567b;border-radius:99px;color:#c8d8ed;font:700 11px ui-monospace,monospace}.pill.good{border-color:#3fbf78;color:var(--green)}.pill.bad{border-color:#d95c75;color:var(--red)}.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.work-card{min-height:205px;display:flex;flex-direction:column;text-align:left;color:inherit;width:100%}.work-card h2{margin-top:17px;line-height:1.28}.work-card .result{margin-top:auto;padding-top:17px;font-weight:800}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.muted{color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.filter{padding:8px 13px;border:1px solid #304b6e;border-radius:8px;background:#0d1a30;color:#b8c7dc}.filter.active{border-color:var(--cyan);color:#fff;background:#17345b}.detail-top{display:flex;gap:10px;align-items:center;margin-bottom:17px}.back{border:0;background:none;color:var(--cyan);padding:0;font-weight:700}.tabs{display:flex;gap:8px;margin:20px 0}.tab{padding:9px 14px;border:1px solid #304b6e;border-radius:8px;background:#0d1a30;color:#b8c7dc}.tab.active{border-color:var(--cyan);color:#fff;background:#17345b}.result-box{padding:22px;border-left:4px solid var(--cyan);border-radius:7px;background:var(--panel2)}.result-box p{font-size:18px;line-height:1.6}.rows{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 15px;border:1px solid var(--line);border-radius:9px;background:#091426}.kv{display:grid;grid-template-columns:190px 1fr;gap:10px 20px}.kv div{padding:9px;border-bottom:1px solid #223853}.activity{border:1px solid var(--line);border-radius:11px;overflow:hidden}.event{display:grid;grid-template-columns:90px 1fr 140px;gap:15px;padding:13px 15px;border-bottom:1px solid #223853}.event:last-child{border:0}.event span{color:var(--muted);font-size:12px}.yaml-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:17px}.pane{min-height:570px;padding:0;overflow:hidden}.pane-head{padding:15px 18px;border-bottom:1px solid var(--line);background:#101e36;display:flex;justify-content:space-between;align-items:center}.pane-body{padding:18px}.mono,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}pre{margin:0;color:#a8bad2;font-size:13px;line-height:1.52;white-space:pre-wrap}.line-focus{display:block;margin:0 -8px;padding:1px 8px;color:#fff;background:#194875;box-shadow:inset 3px 0 var(--cyan)}.command{color:var(--cyan);margin:6px 0}.output{margin:9px 0 17px;padding:13px;border:1px solid #2d4668;border-radius:9px;background:#050b17;color:#bdcbe0}.selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:12px;color:#a9bad0;font-weight:700}.field select,.field input,.field textarea{width:100%;padding:11px 12px;border:1px solid #365174;border-radius:8px;background:#071124;color:#fff}.boundary{padding:12px 14px;border:1px solid #d95c75;border-radius:9px;color:var(--red);background:#2c1020}.modal-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:#000b}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;border:1px solid #45668f;border-radius:16px;background:#0b1830;box-shadow:0 32px 90px #000;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{border:0;background:transparent;color:#aabbd0;font-size:24px}.decision{display:grid;grid-template-columns:.8fr 1.35fr .9fr;gap:15px;align-items:center;margin-top:18px}.checks{display:grid;gap:9px;margin-top:15px}.check{display:flex;justify-content:space-between;padding:11px;border:1px solid #35506f;border-radius:8px}.check.pass{border-color:#3fbf78}.check.fail{border-color:#d95c75}.outcome{min-height:235px}.outcome h2{font-size:28px;margin:20px 0 8px}.mini{display:grid;gap:5px;margin-top:17px}.mini div{display:flex;justify-content:space-between;padding:7px;background:#071123;border-radius:6px;font-size:12px}.identity{display:grid;grid-template-columns:90px 1fr;gap:12px}.identity div{padding:10px;border-bottom:1px solid #233853}@media(max-width:900px){.app{grid-template-columns:76px 1fr}.brand span,.nav span,.side-foot{display:none}.brand{padding-left:4px}.nav{text-align:center;padding:13px 5px}.grid,.yaml-grid,.decision{grid-template-columns:1fr}.pane{min-height:420px}.content{padding:20px}}
</style><style>.toast{position:fixed;right:24px;bottom:24px;z-index:30;padding:13px 17px;border:1px solid #3fbf78;border-radius:10px;background:#0b1b2f;color:#dfffea;box-shadow:0 15px 40px #0008}</style></head><body><div id="app"></div><script>
const DATA={works:[{id:'payments',title:'Diagnose the synthetic retry timeout',project:'payments',template:'engineer',status:'SUCCEEDED',result:'Bounded execution completed'},{id:'billing',title:'Run the same assignment for billing',project:'billing',template:'engineer',status:'DENIED',result:'Stopped before execution'}],platform:`apiVersion: agenova.io/v1alpha1\nkind: Platform\nmetadata:\n  name: reference-kind\nspec:\n  infrastructure:\n    deployment:\n      context: kind-agenova-k8s-lab\n    runtimeProfiles:\n      - name: standard-isolated\n        isolation: dedicated\n  services:\n    modelBackends:\n      - name: local-ollama\n    modelProfiles:\n      - name: coding-standard\n        model: llama3.1:latest`,policy:`apiVersion: agenova.io/v1alpha1\nkind: PolicyBundle\nmetadata:\n  name: reference-default-deny\n  version: "1"\nspec:\n  rules:\n    - team: team-a\n      action: claim.create\n      project: payments\n      templateRef: engineer`,template:`apiVersion: agenova.io/v1alpha1\nkind: AgentTemplate\nmetadata:\n  name: engineer\nspec:\n  artifact:\n    image: agenova-testworker:kind\n  capabilityCeiling:\n    tools: [git.read]\n    resourceScopes: [repo:acme/payments]\n    modelProfiles: [coding-standard]\n    runtimeProfiles: [standard-isolated]\n    maxTimeout: 5m`};
const state={page:'work',work:null,tab:'overview',filter:'All',activityFilter:'All',modal:null,applied:null,focus:{platform:'context:',policy:'project:',agents:'tools:'}};const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const hi=(text,needle)=>esc(text).split('\n').map(l=>l.includes(needle)?`<span class="line-focus">${l}</span>`:l).join('\n');const pill=(text,type='')=>`<span class="pill ${type}">${text}</span>`;
function shell(body){return `<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">A</div><span>Agenova</span></div><nav>${[['work','Work'],['agents','Agents'],['policy','Policy'],['platform','Platform']].map(n=>`<button class="nav ${state.page===n[0]?'active':''}" data-page="${n[0]}"><span>${n[1]}</span></button>`).join('')}</nav><div class="side-foot"><div><span class="dot"></span>Connected</div><div style="margin-top:8px">Local demo environment</div></div></aside><main class="main"><div class="topbar"><div class="crumb">Agenova / ${state.page[0].toUpperCase()+state.page.slice(1)}</div><div class="actions"><span class="status">Demo</span><span class="status"><span class="dot"></span>Connected</span><button class="btn" data-action="identity">View identity</button></div></div><div class="content">${body}</div></main></div>${modal()}${state.applied?`<div class="toast">${state.applied}</div>`:''}`}
function workPage(){if(state.work)return workDetail(DATA.works.find(w=>w.id===state.work));const list=state.filter==='All'?DATA.works:DATA.works.filter(w=>w.status===state.filter);return `<div class="page-head"><div><div class="eyebrow">Governed assignments</div><h1>Work</h1><p class="sub">Each Work is a complete agent assignment—not a tool call.</p></div><button class="btn primary" data-action="new-work">+ Create Work</button></div><div class="toolbar">${['All','SUCCEEDED','DENIED'].map(f=>`<button class="filter ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="grid">${list.map(w=>`<button class="card clickable work-card ${w.status==='SUCCEEDED'?'good':'bad'}" data-work="${w.id}">${pill(w.status,w.status==='SUCCEEDED'?'good':'bad')}<h2>${w.title}</h2><div class="facts">${pill(w.template)}${pill(w.project)}</div><div class="result ${w.status==='SUCCEEDED'?'green':'red'}">${w.result}</div></button>`).join('')}</div>`}
function workDetail(w){const success=w.status==='SUCCEEDED';return `<div class="detail-top"><button class="back" data-action="back-work">← All Work</button>${pill(w.status,success?'good':'bad')}${pill(w.template)}${pill(w.project)}</div><div class="page-head"><div><h1>${w.title}</h1><p class="sub">One claim-scoped worker assignment</p></div>${success?'<button class="btn" data-action="rerun">Run again</button>':''}</div><div class="tabs">${[['overview','Overview'],['access','Access & Limits'],['activity','Activity']].map(t=>`<button class="tab ${state.tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${state.tab==='overview'?overview(w):state.tab==='access'?access(w):activity(w)}`}
function overview(w){if(w.status==='DENIED')return `<div class="card bad"><h2 class="red">Denied before execution</h2><p class="sub">No exact policy rule matched the trusted principal and requested assignment.</p><div class="rows" style="margin-top:18px"><div class="row"><b>Request received</b><span>Recorded</span></div><div class="row"><b>Request resolution</b><span class="red">Deny</span></div></div><p class="red">No claim, worker, tool, or model invocation exists.</p></div>`;return `<div class="rows"><div class="row"><b>Task instructions</b><span>Inspect src/retry.txt and diagnose the synthetic retry timeout</span></div><div class="row"><b>Work status</b><span class="green">Completed and cleaned up</span></div><div class="row"><b>Agent turn</b><span>Model decision → git.read → tool observation</span></div></div><div class="result-box" style="margin-top:16px"><h2>Result</h2><p>The retries exceed the deadline because each attempt resets the five-second deadline instead of using remaining time, combined with no idempotency-key reuse.</p><span class="muted">Final model call: qwen3:8b · 904 input / 66 output tokens</span></div>`}
function access(w){if(w.status==='DENIED')return `<div class="card bad"><h2>No authority was issued</h2><p class="sub">The request stopped at policy resolution. Later checks were not reached.</p></div>`;return `<div class="grid"><div class="card"><div class="eyebrow">Requested intent</div><div class="kv"><div>Tool</div><div>git.read</div><div>Repository</div><div>repo:acme/payments</div><div>Model</div><div>coding-standard</div><div>Runtime</div><div>standard-isolated</div><div>Timeout</div><div>5m</div></div></div><div class="card good"><div class="eyebrow green">Effective authority</div><div class="kv"><div>Claim</div><div>clm_01J...</div><div>Policy</div><div>reference-default-deny@1</div><div>Worker</div><div>worker-7b4...</div><div>Scope</div><div>repo:acme/payments</div><div>Cleanup</div><div class="green">complete</div></div></div></div><p class="sub">One SandboxClaim governs this complete worker assignment—not one tool call.</p>`}
function activity(w){const all=w.status==='SUCCEEDED'?[['13:57:58','Request received','Recorded','Request'],['13:57:58','Policy resolution: payments matched','Allow','Request'],['13:57:59','SandboxClaim issued','Claim','Runtime'],['13:58:02','Worker allocated','Runtime','Runtime'],['13:58:04','Model decision and git.read observation','Model Gateway','Model Gateway'],['13:58:07','Result recorded; worker cleaned up','Complete','Runtime']]:[['13:58:00','Request received','Recorded','Request'],['13:58:00','Request resolution: no matching policy rule','Deny','Request']],events=state.activityFilter==='All'?all:all.filter(e=>e[3]===state.activityFilter);return `<div class="toolbar">${['All','Request','Runtime','Model Gateway'].map(f=>`<button class="filter ${state.activityFilter===f?'active':''}" data-activity-filter="${f}">${f}</button>`).join('')}</div><div class="activity">${events.map(e=>`<div class="event"><span>${e[0]}</span><b>${e[1]}</b><span>${e[2]}</span></div>`).join('')}</div>`}
function configPage(kind){const cfg=kind==='platform'?DATA.platform:kind==='policy'?DATA.policy:DATA.template,title=kind==='platform'?'Platform':kind==='policy'?'Policy':'Agent Templates',desc=kind==='platform'?'Where governed execution can run':kind==='policy'?'Who may create an assignment':'Reusable roles and their capability ceilings',choices=kind==='platform'?[['context:','Deployment'],['isolation:','Runtime'],['model:','Model']]:kind==='policy'?[['team:','Caller'],['action:','Action'],['project:','Project'],['templateRef:','Template']]:[['image:','Worker image'],['tools:','Tool'],['resourceScopes:','Scope'],['modelProfiles:','Model'],['runtimeProfiles:','Runtime'],['maxTimeout:','Timeout']],command=kind==='platform'?'agenova platform status':kind==='policy'?'agenova policy apply -f deploy/reference/demo/policy.yaml':'agenova agent-template apply -f deploy/reference/demo/engineer.yaml',output=kind==='platform'?'INSTALLATION READY':kind==='policy'?'REGISTERED reference-default-deny@1':'REGISTERED engineer';return `<div class="page-head"><div><div class="eyebrow">Reusable governance</div><h1>${title}</h1><p class="sub">${desc}</p></div><button class="btn" data-action="apply">${kind==='agents'?'Register template':'Apply configuration'}</button></div><div class="selector">${choices.map(c=>`<button class="filter ${state.focus[kind]===c[0]?'active':''}" data-focus-kind="${kind}" data-focus="${c[0]}">${c[1]}</button>`).join('')}</div><div class="yaml-grid"><section class="card pane"><div class="pane-head"><b>${kind==='platform'?'platform.kind.yaml':kind==='policy'?'policy.yaml':'engineer.yaml'}</b>${pill(kind==='policy'?'DEFAULT DENY':kind==='platform'?'READY':'CAPABILITY CEILING',kind==='platform'?'good':'')}</div><div class="pane-body"><pre>${hi(cfg,state.focus[kind])}</pre>${kind==='policy'?'<div class="boundary" style="margin-top:18px">Everything unmatched stays denied.</div>':''}</div></section><section class="card pane"><div class="pane-head"><b>Terminal</b>${pill('REAL CONFIG')}</div><div class="pane-body"><div class="command">$ ${command}</div><div class="output"><b class="green">${output}</b></div>${kind==='platform'?'<div class="rows"><div class="row"><b>Runtime adapter</b><span class="green">Ready</span></div><div class="row"><b>Model backend</b><span>local-ollama</span></div><div class="row"><b>Deployment</b><span>kind-agenova-k8s-lab</span></div></div>':kind==='policy'?'<p class="sub">Identical reapply: already registered</p>':'<p class="sub">The template is reusable. Every Work is still authorized independently.</p>'}</div></section></div>`}
function modal(){if(!state.modal)return '';if(state.modal==='identity')return `<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>Connected identity</h2><button class="close" data-action="close">×</button></div><div class="identity"><div class="muted">Principal</div><div>team-a</div><div class="muted">Action</div><div>claim.create</div><div class="muted">Connection</div><div class="green">Local demo environment</div></div></div></div>`;if(state.modal.result)return decisionModal(state.modal.result);return `<div class="modal-bg"><form class="modal" id="create-form"><div class="modal-head"><div><div class="eyebrow">Per-assignment request</div><h2>Create Work</h2></div><button class="close" type="button" data-action="close">×</button></div><div class="field"><label>Agent template</label><select><option>engineer</option></select></div><div class="field"><label>Project</label><select name="project"><option value="payments">payments — allowed by policy</option><option value="billing">billing — no matching policy rule</option></select></div><div class="field"><label>Task instructions</label><textarea rows="3">Inspect src/retry.txt and diagnose the synthetic retry timeout.</textarea></div><div class="grid"><div class="field"><label>Tool</label><input value="git.read" readonly></div><div class="field"><label>Repository scope</label><input value="repo:acme/payments" readonly></div></div><div class="grid"><div class="field"><label>Model profile</label><input value="coding-standard" readonly></div><div class="field"><label>Runtime profile</label><input value="standard-isolated" readonly></div></div><p class="sub">This form expresses requested intent. It cannot grant authority.</p><div class="actions" style="justify-content:flex-end;margin-top:20px"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary" type="submit">Submit ClaimRequest</button></div></form></div>`}
function decisionModal(project){const allowed=project==='payments';return `<div class="modal-bg"><div class="modal" style="width:min(980px,100%)"><div class="modal-head"><div><div class="eyebrow">Authorization resolver</div><h2>Resolve effective authority</h2></div><button class="close" data-action="close">×</button></div><div class="decision"><div class="card"><h3>ClaimRequest</h3><p class="mono">projectRef<br><b class="${allowed?'green':'red'}">${project}</b></p><span class="muted">Other fields unchanged</span></div><div class="card"><h3>Checks</h3><div class="checks"><div class="check ${allowed?'pass':'fail'}"><b>1 · Policy</b><span>${allowed?'MATCHED':'NO MATCH'}</span></div><div class="check ${allowed?'pass':''} ${!allowed?'muted':''}"><b>2 · AgentTemplate</b><span>${allowed?'WITHIN CEILING':'NOT REACHED'}</span></div><div class="check ${allowed?'pass':''} ${!allowed?'muted':''}"><b>3 · Runtime</b><span>${allowed?'RUNTIME BOUNDED':'NOT REACHED'}</span></div></div></div><div class="card outcome ${allowed?'good':'bad'}"><h3>Outcome</h3><h2 class="${allowed?'green':'red'}">${allowed?'ALLOWED':'DENIED BEFORE EXECUTION'}</h2>${allowed?'<p>Bounded authority issued</p>':'<div class="mini"><div><span>Claim</span><b class="red">not issued</b></div><div><span>Worker</span><b class="red">not allocated</b></div><div><span>Tool</span><b class="red">not called</b></div><div><span>Model</span><b class="red">not called</b></div></div>'}</div></div><div class="actions" style="justify-content:flex-end;margin-top:20px"><button class="btn primary" data-action="open-result" data-project="${project}">Open Work</button></div></div></div>`}
function render(){document.getElementById('app').innerHTML=shell(state.page==='work'?workPage():configPage(state.page));bind()}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;state.work=null;state.tab='overview';state.applied=null;render()});document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{state.work=b.dataset.work;state.tab='overview';state.activityFilter='All';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.activityFilter='All';render()});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{state.focus[b.dataset.focusKind]=b.dataset.focus;state.applied=null;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='new-work'||a==='rerun')state.modal='create';if(a==='identity')state.modal='identity';if(a==='close')state.modal=null;if(a==='back-work')state.work=null;if(a==='apply')state.applied=state.page==='agents'?'Agent template registered: engineer':state.page==='policy'?'Policy already registered: identical content':'Platform configuration unchanged: ready';if(a==='open-result'){state.modal=null;state.page='work';state.work=b.dataset.project;state.tab='overview'}render()});document.querySelectorAll('[data-activity-filter]').forEach(b=>b.onclick=()=>{state.activityFilter=b.dataset.activityFilter;render()});const form=document.getElementById('create-form');if(form)form.onsubmit=e=>{e.preventDefault();state.modal={result:new FormData(form).get('project')};render()}}render();
</script></body></html>
